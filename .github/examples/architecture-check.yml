name: Architecture review
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install .
      # Runnable teaching fixtures. Adopting teams replace these with reviewed models/rules.
      - run: architecture-suite diff --before skills/architecture-suite-runtime/samples/extensions/model.json --after skills/architecture-suite-runtime/samples/extensions/model.json --output artifacts/diff --confirm-write
      - run: architecture-suite check --model skills/architecture-suite-runtime/samples/extensions/model.json --rules skills/architecture-suite-runtime/samples/extensions/rules.json --baseline skills/architecture-suite-runtime/samples/extensions/checks/baseline.json --output artifacts/check --confirm-write
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-review
          path: artifacts
