name: Release
# Push a tag like v1.0.0 (matching the package version) from main to publish.
on:
  push:
    tags: ['v*']

jobs:
  verify:
    uses: ./.github/workflows/architecture.yml
    permissions:
      contents: read
    with:
      os: '["ubuntu-latest", "windows-latest"]'

  # Hosted macOS arm64 runners are capacity-constrained and have gone unassigned for whole
  # runs ("The job was not acquired by Runner"), which blocked the first v1.0.0 release.
  # macOS still runs on every release and every push to main, but does not gate publishing;
  # check this job's result before approving the pull request that updates latest.
  verify-macos:
    uses: ./.github/workflows/architecture.yml
    permissions:
      contents: read
    with:
      os: '["macos-latest"]'
      skip-os-independent: true

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked tree
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Tag matches the package version
        run: |
          version=$(python -c "import architecture_suite; print(architecture_suite.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          echo "PLUGIN_BRANCH=architecture-suite-$version" >> "$GITHUB_ENV"
      - name: Versioned plugin branch does not exist yet
        run: |
          if git ls-remote --exit-code --heads origin "$PLUGIN_BRANCH" >/dev/null; then
            echo "Branch $PLUGIN_BRANCH already exists; each release branch is published once."; exit 1
          fi
      - name: Build host archives and the release plugin tree
        run: python tools/package_hosts.py
      - name: Checksums
        working-directory: dist/hosts
        run: sha256sum *.zip > SHA256SUMS
      - name: GitHub release with host archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/hosts/*.zip dist/hosts/SHA256SUMS \
            --title "Architecture Suite $GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
      # latest and architecture-suite-* are protected by a ruleset: no updates except through a
      # reviewed pull request, no force-pushes, no deletions. Creating a new branch is allowed,
      # so the versioned branch (and latest, on the first release) is created by push; later
      # updates to latest arrive as a pull request for the maintainer to approve and merge.
      - name: Publish the versioned branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add --orphan -b "$PLUGIN_BRANCH" version-tree
          rsync -a --delete --exclude .git dist/plugin/ version-tree/
          git -C version-tree add -A
          git -C version-tree commit -m "Architecture Suite $GITHUB_REF_NAME"
          git push origin "$PLUGIN_BRANCH"
      - name: Create latest, or open the pull request that updates it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote --exit-code --heads origin latest >/dev/null; then
            git push origin "$PLUGIN_BRANCH:refs/heads/latest"
            echo "Created latest at $GITHUB_REF_NAME."
            exit 0
          fi
          staging="plugin-staging/latest-$GITHUB_REF_NAME"
          git fetch origin latest
          git worktree add -b "$staging" latest-tree origin/latest
          rsync -a --delete --exclude .git dist/plugin/ latest-tree/
          git -C latest-tree add -A
          git -C latest-tree commit -m "Architecture Suite $GITHUB_REF_NAME"
          git push origin "$staging"
          body="Updates the latest plugin branch to $GITHUB_REF_NAME, built by the release workflow"
          body="$body from the $GITHUB_REF_NAME tag and identical to $PLUGIN_BRANCH."
          body="$body Users on #latest receive the update once this is merged."
          body="$body Delete the head branch after merging."
          gh pr create --base latest --head "$staging" \
            --title "Publish Architecture Suite $GITHUB_REF_NAME to latest" --body "$body"
